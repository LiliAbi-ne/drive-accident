<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATUS 2020 · Mapa de calor</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1 id="heat-title">ATUS 2020 · Mapa de calor del país</h1>
        <p class="subtitle" id="heat-subtitle">Densidad de accidentes georreferenciados</p>
      </div>
      <nav class="navbar">
        <a class="nav-link" href="/">Explorador</a>
        <a class="nav-link" href="/#resumen">Resumen</a>
        <a class="nav-link is-active" href="/heatmap" aria-current="page">Mapa de calor</a>
        <a class="nav-link" href="/temporal">Temporal</a>
      </nav>
      <nav class="topbar-actions">
        <span id="status" class="status" data-state="loading">Cargando…</span>
        <a class="link-button" id="heat-back" href="/heatmap" hidden>País completo</a>
      </nav>
    </header>

    <main class="heat-layout">
      <div id="heat-map" class="map" aria-label="Mapa de calor de accidentes"></div>

      <div class="heat-legend">
        <span class="heat-legend__label">Menos</span>
        <span class="heat-legend__bar"></span>
        <span class="heat-legend__label">Más</span>
      </div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="/heatmap.js" type="module"></script>
  </body>
</html>
