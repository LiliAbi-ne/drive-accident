<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATUS · Explorador de accidentes</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>ATUS · Explorador de accidentes</h1>
        <p class="subtitle" id="page-subtitle">Primer registro de la base municipal georreferenciada</p>
      </div>
      <nav class="navbar">
        <a class="nav-link is-active" href="/" data-nav="detail">Explorador</a>
        <a class="nav-link" href="/#resumen" data-nav="summary">Resumen</a>
        <a class="nav-link" href="/heatmap">Mapa de calor</a>
        <a class="nav-link" href="/temporal">Temporal</a>
      </nav>
      <div class="topbar-actions">
        <span id="status" class="status" data-state="loading">Cargando…</span>
      </div>
    </header>

    <main class="layout">
      <div id="map" class="map" aria-label="Mapa del accidente"></div>

      <aside class="panel" aria-live="polite">
        <div class="tabs" role="tablist">
          <button class="tab is-active" type="button" role="tab" aria-selected="true" data-view="detail">
            Detalle
          </button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-view="summary">
            Resumen
          </button>
        </div>

        <section class="view" id="view-detail" role="tabpanel">
          <div class="summary-controls">
            <label class="summary-label" for="detail-year">Año</label>
            <select id="detail-year"></select>
          </div>
          <div id="detail-content">
            <p class="placeholder">Leyendo el primer registro del CSV…</p>
          </div>
        </section>

        <section class="view" id="view-summary" role="tabpanel" hidden>
          <div class="summary-controls">
            <label class="summary-label" for="year-filter">Año</label>
            <select id="year-filter">
              <option value="all">Todos</option>
            </select>
          </div>
          <div class="table-wrap" id="summary-table">
            <p class="placeholder">Cargando resumen…</p>
          </div>
        </section>
      </aside>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
